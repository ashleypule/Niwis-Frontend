# Types, lint, format, unit tests, builds and the Playwright suite on every push and pull request. No secrets and no
# backend: live panels are served from the recorded API responses in tests/fixtures/backend (the "hybrid" project).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck, lint, prettier --check, unit tests, mock / live builds, generated docs
      - run: npm run verify
      - name: Production build (api mode, no mock service worker)
        run: npm run build:release
      - name: Dependency audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # mock smoke test of every route, hybrid pages from recorded fixtures, backend-down errors
      - run: npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
