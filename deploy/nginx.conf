# NIWIS production web server: serves the built app (dist-release) and proxies /api and /docs to the API container.
# Used by the Dockerfile in this repository and by the backend's deploy/docker-compose.prod.yml.

# The edge proxy decides the client address; the API trusts X-Forwarded-For only from this container's network
# (TRUSTED_PROXY_CIDRS in the API's environment).
upstream niwis_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # runs as the unprivileged nginx user on a read-only filesystem: temporary files go to /tmp (a tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 16k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;

    # The inline theme script in index.html is allowed by its hash (tests/unit/csp.test.ts keeps the two in sync).
    # Map tiles come from CARTO; fonts are self-hosted; the API is same-origin.
    set $csp "default-src 'self'; script-src 'self' 'sha256-ESQNxafaKmNulrU0abeooMSLZ8wD3IpQLashqz4s1zU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # Fingerprinted build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Boundaries and the logo change only with a release.
    location ~ ^/(geo|brand)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The API sets its own Cache-Control (max-age = its cache lifetime) and security headers.
    location /api/ {
        proxy_pass http://niwis_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;  # (stops the app's headers being added on top of the API's)
    }

    # Interactive API documentation stays public (Swagger UI and its schema).
    # (Its own add_header stops the app's CSP being inherited: the API sends the CSP Swagger UI needs.)
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://niwis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: every other path is index.html, never cached so a release shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
